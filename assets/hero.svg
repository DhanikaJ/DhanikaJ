<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="ASCII portrait of Dhanika and a terminal intro: full-stack software engineer, open to an internship or junior roles">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58e6aa"/><stop offset="1" stop-color="#79c0ff"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58e6aa" stop-opacity="0"/><stop offset=".5" stop-color="#58e6aa" stop-opacity=".22"/><stop offset="1" stop-color="#58e6aa" stop-opacity="0"/></linearGradient>
<clipPath id="pclip"><rect x="0" y="0" width="464" height="560"/></clipPath>
</defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace;white-space:pre}
.pl{fill:url(#pg);opacity:0;animation:show .25s ease-out forwards}
.cover{fill:#0d1117;transform-box:fill-box;animation:wipe var(--d,1s) steps(var(--n,10),end) var(--t,0s) forwards}
.scan{animation:sweep 5.5s linear 3s infinite;transform:translateY(-40px)}
.cur{animation:blink 1s steps(1) infinite}
.prompt{fill:#58e6aa}.txt{fill:#c9d1d9}.hl{fill:#79c0ff;font-weight:700}.dim{fill:#8b949e}
@keyframes show{to{opacity:1}}
@keyframes wipe{to{transform:translateX(104%)}}
@keyframes sweep{to{transform:translateY(600px)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pl{opacity:1;animation:none}.cover,.scan{display:none}.cur{animation:none}}
</style>
